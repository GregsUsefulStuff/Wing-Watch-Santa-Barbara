name: Update sightings

on:
  schedule:
    - cron: "23 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sightings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch sightings
        run: python scripts/fetch.py
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "wing-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update sightings $(date -u +%F)"
          git push
